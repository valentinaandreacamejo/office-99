<section id="services" class="services" aria-labelledby="services-title">
  <header class="services__head">
    <app-badge label="02 // SERVICES" />
    <h2 id="services-title">What we <em>file</em></h2>
  </header>

  <ol class="services__list" role="list">
    @for (item of items; track item.code) {
      <li class="service">
        <img
          class="service__icon"
          [src]="item.icon"
          alt=""
          width="112"
          height="112"
          loading="lazy"
        />
        <h3 class="service__title font-ui">
          <span class="service__code font-mono">[{{ item.code }}]</span>
          {{ item.title }}
        </h3>
        <p class="service__desc">{{ item.description }}</p>
      </li>
    }
  </ol>
</section>
