<footer class="footer bg-garnet">
  <div class="footer__inner">
    <p class="footer__wordmark font-ui">OFFICE&nbsp;99</p>

    <ul class="footer__social font-mono" role="list" aria-label="Social">
      @for (link of socials; track link.label) {
        <li>
          <a [href]="link.href" target="_blank" rel="noopener noreferrer">[{{ link.label }}]</a>
        </li>
      }
    </ul>

    <div class="footer__bottom font-mono">
      <p class="footer__copyright">© 2026 OFFICE 99 • Showcase Project by Valentina Camejo</p>
      <p class="footer__signature">
        Designed &amp; Developed by
        <a href="https://valentinacamejo.com" target="_blank" rel="noopener noreferrer"
          >Valentina Camejo <span aria-hidden="true">↗</span></a
        >
      </p>
    </div>
  </div>
</footer>
